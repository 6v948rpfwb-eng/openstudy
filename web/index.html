<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开卷 · 练习引擎</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #f4f7ff;
    --card: #ffffff;
    --ink: #1b2536;
    --sub: #6c7a90;
    --line: #e2e8f4;
    --accent: #4d6bfe;
    --accent-deep: #3a51d6;
    --accent-soft: #eef2ff;
    --wrong: #c04b52;
    --wrong-soft: #fdeef0;
    --warn: #b4762a;
    --shadow: 0 1px 2px rgba(27, 37, 54, .04), 0 12px 28px rgba(77, 107, 254, .07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto;
    background:
      radial-gradient(1200px 420px at 12% -8%, #e7edff 0%, rgba(231, 237, 255, 0) 62%),
      radial-gradient(900px 380px at 96% 0%, #eaf0ff 0%, rgba(234, 240, 255, 0) 58%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.68 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    padding: 22px 16px 72px;
    max-width: 760px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .6px; font-weight: 650; }
  .sub { color: var(--sub); font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-top: 14px;
    box-shadow: var(--shadow);
  }
  .btn {
    appearance: none; border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    border-radius: 10px; padding: 10px 18px;
    font-size: 15px; font-family: inherit;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.plain { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stat { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .stat div { font-size: 13px; color: var(--sub); }
  .stat b { display: block; font-size: 20px; color: var(--ink); font-weight: 600; }
  .stem { font-size: 17px; line-height: 1.7; margin: 0 0 14px; white-space: pre-wrap; }
  input[type=text] {
    width: 100%; padding: 11px 13px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #fdfcfa; color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  .choice {
    display: block; width: 100%; text-align: left; margin: 8px 0;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: #fdfcfa; cursor: pointer; font: inherit; color: inherit;
  }
  .choice.picked { border-color: var(--accent); background: var(--accent-soft); }
  .choice.right { border-color: var(--accent); background: var(--accent-soft); }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
  .feedback { border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
  .feedback.ok { background: var(--accent-soft); }
  .feedback.no { background: var(--wrong-soft); }
  .feedback .sol { color: var(--sub); margin-top: 8px; white-space: pre-wrap; }
  .tag {
    display: inline-block; font-size: 12px; padding: 2px 8px;
    border-radius: 20px; background: #f0ece4; color: var(--sub); margin-right: 6px;
  }
  .tag.due { background: #fbf0dd; color: var(--warn); }
  .tag.ok { background: var(--accent-soft); color: var(--accent); }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  .muted { color: var(--sub); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 500; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 26px 16px;
    text-align: center; color: var(--sub); font-size: 14px;
  }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  code { background: #f0ece4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }

/* ---- 数学记号 ---- */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle;
        text-align: center; margin: 0 .14em; line-height: 1.15; font-size: .96em; }
.frac .fnum { padding: 0 .22em 1px; border-bottom: 1px solid currentColor; }
.frac .fden { padding: 1px .22em 0; }
.sqrt { display: inline-block; white-space: nowrap; }
.sqrt .srad { padding-right: 1px; }
.sqrt .sbody { display: inline-block; border-top: 1px solid currentColor; padding: 0 .12em; }
.sqrt .sidx { font-size: .62em; vertical-align: super; }
.mrm { font-style: normal; }
.mfn { font-style: normal; padding-right: .08em; }
sup, sub { font-size: .72em; line-height: 0; }
.mathblock { display: block; text-align: center; margin: .5em 0; }

/* ---- 提问框 ---- */
.askbox { margin-top:16px; border-top:1px dashed var(--line, #ddd); padding-top:10px; }
.askbox summary { cursor:pointer; color:#666; font-size:14px; user-select:none; }
.askbox textarea { width:100%; margin-top:8px; box-sizing:border-box; }

/* ---- 题目配图 ---- */
.figbox { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.figbox .fig { max-width: 100%; border-radius: 8px; border: 1px solid var(--line, #e5e5e5); background: #fff; }
.fignote { margin: 10px 0 0; padding: 9px 12px; border-left: 3px solid #d9a441; background: #fdf7ea; color: #7a5c19; font-size: 13px; line-height: 1.6; border-radius: 4px; }
  /* ---- 方法论视图（四组 + 三张表） ---- */
  #tabs { display: flex; gap: 8px; margin: 14px 0 0; }
  .tab { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--sub);
         border-radius: 10px; padding: 7px 16px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff;
            box-shadow: 0 6px 16px rgba(77, 107, 254, .28); }
  .gbadge { display: inline-block; min-width: 22px; text-align: center; border-radius: 6px;
            padding: 1px 7px; font-size: 12px; font-weight: 600; margin-right: 4px; }
  .bA { background: #e7eefb; color: #2c4f8f; } .bB { background: var(--accent-soft); color: #2f6f4e; }
  .bC { background: #fbf1e2; color: var(--warn); } .bD { background: #f0e9f7; color: #6a4a91; }
  .fst { font-size: 12px; border-radius: 6px; padding: 1px 7px; margin-left: 4px; }
  .fst.ok { background: var(--accent-soft); color: var(--accent); }
  .fst.mid { background: #fbf1e2; color: var(--warn); }
  .fst.bad { background: var(--wrong-soft); color: var(--wrong); }
  .fst.none { background: #f1eee8; color: var(--sub); }
  .cues { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cue { font-size: 12px; color: #4a4a4a; background: #f6f3ec; border-radius: 6px; padding: 2px 8px; }
  .fwcard, .gcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
                    padding: 12px 14px; margin-top: 10px; }
  .fwcard > summary, .gcard > summary { cursor: pointer; list-style: none; }
  .fwcard > summary::-webkit-details-marker, .gcard > summary::-webkit-details-marker { display: none; }
  .fwcard[open], .gcard[open] { border-color: var(--accent); }
  .fchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .fchip { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--sub);
           border-radius: 999px; padding: 5px 13px; font-size: 13px; font-family: inherit; cursor: pointer; }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* ---- 右上角学科切换 ---- */
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  #subjects { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; padding-top: 6px; }
  .subj { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
          border-radius: 10px; padding: 7px 16px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .subj.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .subj:not(.on):hover { border-color: var(--accent); color: var(--accent); }
  /* ---- 大肥鱼（页角看护人） ---- */
  .mascot { position: fixed; right: 18px; bottom: 12px; width: 112px; height: 112px;
            z-index: 50; cursor: pointer; user-select: none;
            filter: drop-shadow(0 6px 14px rgba(58,81,214,.18)); }
  .mascot svg { display: block; width: 100%; height: 100%; }
  .m-mouth { display: none; }
  .mood-idle .m-mouth-idle, .mood-happy .m-mouth-happy,
  .mood-sad .m-mouth-sad, .mood-think .m-mouth-think { display: block; }
  .mascot svg { transition: transform .2s ease; }
  .mood-happy svg { transform: rotate(-3deg) translateY(-2px); }
  .mood-sad svg { transform: translateY(2px) rotate(1.5deg); }
  .mood-think svg { transform: rotate(2deg); }
  .m-bubble { position: absolute; right: 104px; bottom: 52px; max-width: 220px;
              background: #fff; border: 1px solid var(--line); color: var(--ink);
              border-radius: 12px; padding: 8px 11px; font-size: 13px; line-height: 1.5;
              opacity: 0; transform: translateY(4px) scale(.96); transition: opacity .16s, transform .16s;
              pointer-events: none; white-space: normal; }
  .m-bubble::after { content: ''; position: absolute; right: -6px; bottom: 12px;
                     width: 10px; height: 10px; background: #fff;
                     border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
                     transform: rotate(-45deg); }
  .mascot.talking .m-bubble { opacity: 1; transform: translateY(0) scale(1); }
  .mascot.talking { animation: mbob 1.6s ease-in-out infinite; }
  @keyframes mbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  /* 开关（「只为没掌握的考点出题」那一行） */
  .switch { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
            font-size: 14px; color: var(--ink); cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 38px; height: 22px; border-radius: 11px;
                  background: #cfd8ea; position: relative; transition: background .16s; cursor: pointer; margin: 0; }
  .switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                         border-radius: 50%; background: #fff; transition: transform .16s;
                         box-shadow: 0 1px 2px rgba(27,37,54,.25); }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(16px); }
  /* 表格与选项的细节打磨 */
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: 600; font-size: 13px; color: var(--sub);
       border-bottom: 1px solid var(--line); padding: 8px 6px; }
  td { border-bottom: 1px solid #f1f4fb; padding: 8px 6px; font-size: 14px; }
  tbody tr:hover td { background: #fafbff; }
  select { background: #fff; color: var(--ink); }
  select:focus, .btn:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  .choice, .opt { transition: background .12s, border-color .12s, transform .08s; }
  .choice:hover, .opt:hover { border-color: var(--accent); }
  .choice:active, .opt:active { transform: scale(.995); }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>开卷</h1>
      <div class="sub">可验证的练习引擎 —— 学科是数据，引擎是代码</div>
    </div>
    <div id="subjects"></div>
  </div>
  <div id="tabs"></div>
  <script>
    // 出错就直接显示在页面上，别只留在控制台（单文件双击打开时看不到控制台）
    window.addEventListener('error', function (e) {
      var pre = document.createElement('pre')
      pre.style.cssText = 'color:#a8443a;background:#f8e9e6;padding:10px;border-radius:8px;white-space:pre-wrap'
      pre.textContent = '页面出错：' + (e.message || e.error) + (e.lineno ? '（第 ' + e.lineno + ' 行）' : '')
      document.body.appendChild(pre)
    })
  </script>
  <div id="root"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
