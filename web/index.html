<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开卷 · 练习引擎</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* 能力水平后面的小提示点 */
  .infowrap{position:relative;display:inline-block;margin-left:6px;vertical-align:middle}
  .infodot{width:14px;height:14px;padding:0;border-radius:50%;border:1px solid #c9d1e4;
    background:#fff;color:#8a93a8;font:600 10px/1 system-ui;cursor:help}
  .infodot:hover{border-color:var(--accent,#4d6bfe);color:var(--accent,#4d6bfe)}
  .infopop{display:none;position:absolute;left:50%;transform:translateX(-50%);top:20px;width:300px;
    background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(30,50,90,.18);
    padding:10px 12px;font:13px/1.65 system-ui;color:#33405a;z-index:30;text-align:left}
  .infowrap:hover .infopop,.infodot:focus + .infopop,.infodot:focus-visible + .infopop{display:block}
  .infopop ul{margin:6px 0 0;padding-left:16px}
  .infopop li{margin:3px 0}
  /* 问大肥鱼按钮与面板 */
  #askfloat{position:fixed;left:18px;bottom:18px;width:52px;height:52px;border-radius:50%;
    border:none;background:var(--accent,#4d6bfe);color:#fff;font:600 16px/1 system-ui;
    box-shadow:0 6px 18px rgba(77,107,254,.35);cursor:pointer;z-index:40}
  #askfloat:hover{filter:brightness(1.05)}
  .askpanel{position:fixed;left:18px;bottom:82px;width:340px;background:#fff;border-radius:16px;
    box-shadow:0 12px 40px rgba(30,50,90,.18);padding:14px;z-index:41}
  .askpanel[hidden]{display:none}
  .askhead{font-weight:600;margin-bottom:8px}
  .askpanel textarea{width:100%;border:1px solid #dfe4ee;border-radius:10px;padding:8px 10px;
    font:14px/1.6 system-ui;resize:vertical;box-sizing:border-box}
  :root {
    --bg: #f4f7ff;
    --card: #ffffff;
    --ink: #1b2536;
    --sub: #6c7a90;
    --line: #e2e8f4;
    --accent: #4d6bfe;
    --accent-deep: #3a51d6;
    --accent-soft: #eef2ff;
    --wrong: #c04b52;
    --wrong-soft: #fdeef0;
    --warn: #b4762a;
    --shadow: 0 1px 2px rgba(27, 37, 54, .04), 0 12px 28px rgba(77, 107, 254, .07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto;
    background:
      radial-gradient(1200px 420px at 12% -8%, #e7edff 0%, rgba(231, 237, 255, 0) 62%),
      radial-gradient(900px 380px at 96% 0%, #eaf0ff 0%, rgba(234, 240, 255, 0) 58%),
      var(--bg);
    color: var(--ink);
    font: 15px/1.68 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    padding: 22px 16px 72px;
    max-width: 760px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .6px; font-weight: 650; }
  .sub { color: var(--sub); font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-top: 14px;
    box-shadow: var(--shadow);
  }
  .btn {
    appearance: none; border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    border-radius: 10px; padding: 10px 18px;
    font-size: 15px; font-family: inherit;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn.plain { background: transparent; color: var(--sub); border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stat { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .stat div { font-size: 13px; color: var(--sub); }
  .stat b { display: block; font-size: 20px; color: var(--ink); font-weight: 600; }
  .stem { font-size: 17px; line-height: 1.7; margin: 0 0 14px; white-space: pre-wrap; }
  input[type=text] {
    width: 100%; padding: 11px 13px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #fdfcfa; color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  .choice {
    display: block; width: 100%; text-align: left; margin: 8px 0;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: #fdfcfa; cursor: pointer; font: inherit; color: inherit;
  }
  .choice.picked { border-color: var(--accent); background: var(--accent-soft); }
  .choice.right { border-color: var(--accent); background: var(--accent-soft); }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
  .feedback { border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
  .feedback.ok { background: var(--accent-soft); }
  .feedback.no { background: var(--wrong-soft); }
  .feedback .sol { color: var(--sub); margin-top: 8px; white-space: pre-wrap; }
  .tag {
    display: inline-block; font-size: 12px; padding: 2px 8px;
    border-radius: 20px; background: #f0ece4; color: var(--sub); margin-right: 6px;
  }
  .tag.due { background: #fbf0dd; color: var(--warn); }
  .tag.ok { background: var(--accent-soft); color: var(--accent); }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  .muted { color: var(--sub); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 500; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px; padding: 26px 16px;
    text-align: center; color: var(--sub); font-size: 14px;
  }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  code { background: #f0ece4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }

/* ---- 数学记号 ---- */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle;
        text-align: center; margin: 0 .14em; line-height: 1.15; font-size: .96em; }
.frac .fnum { padding: 0 .22em 1px; border-bottom: 1px solid currentColor; }
.frac .fden { padding: 1px .22em 0; }
.sqrt { display: inline-block; white-space: nowrap; }
.sqrt .srad { padding-right: 1px; }
.sqrt .sbody { display: inline-block; border-top: 1px solid currentColor; padding: 0 .12em; }
.sqrt .sidx { font-size: .62em; vertical-align: super; }
.mrm { font-style: normal; }
.mfn { font-style: normal; padding-right: .08em; }
sup, sub { font-size: .72em; line-height: 0; }
.mathblock { display: block; text-align: center; margin: .5em 0; }

/* ---- 提问框 ---- */
.askbox { margin-top:16px; border-top:1px dashed var(--line, #ddd); padding-top:10px; }
.askbox summary { cursor:pointer; color:#666; font-size:14px; user-select:none; }
.askbox textarea { width:100%; margin-top:8px; box-sizing:border-box; }

/* ---- 题目配图 ---- */
.figbox { margin: 12px 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.figbox .fig { max-width: 100%; border-radius: 8px; border: 1px solid var(--line, #e5e5e5); background: #fff; }
.fignote { margin: 10px 0 0; padding: 9px 12px; border-left: 3px solid #d9a441; background: #fdf7ea; color: #7a5c19; font-size: 13px; line-height: 1.6; border-radius: 4px; }
  /* ---- 方法论视图（四组 + 三张表） ---- */
  #tabs { display: flex; gap: 8px; margin: 14px 0 0; }
  .tab { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--sub);
         border-radius: 10px; padding: 7px 16px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .backbtn{width:34px;height:34px;padding:0;border-radius:50%;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;margin-right:2px}
.backbtn:hover{background:#e8edff;color:#4d6bfe}
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff;
            box-shadow: 0 6px 16px rgba(77, 107, 254, .28); }
  .gbadge { display: inline-block; min-width: 22px; text-align: center; border-radius: 6px;
            padding: 1px 7px; font-size: 12px; font-weight: 600; margin-right: 4px; }
  .bA { background: #e7eefb; color: #2c4f8f; } .bB { background: var(--accent-soft); color: #2f6f4e; }
  .bC { background: #fbf1e2; color: var(--warn); } .bD { background: #f0e9f7; color: #6a4a91; }
  .fst { font-size: 12px; border-radius: 6px; padding: 1px 7px; margin-left: 4px; }
  .fst.ok { background: var(--accent-soft); color: var(--accent); }
  .fst.mid { background: #fbf1e2; color: var(--warn); }
  .fst.bad { background: var(--wrong-soft); color: var(--wrong); }
  .fst.none { background: #f1eee8; color: var(--sub); }
  .cues { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cue { font-size: 12px; color: #4a4a4a; background: #f6f3ec; border-radius: 6px; padding: 2px 8px; }
  .fwcard, .gcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
                    padding: 12px 14px; margin-top: 10px; }
  .fwcard > summary, .gcard > summary { cursor: pointer; list-style: none; }
  .fwcard > summary::-webkit-details-marker, .gcard > summary::-webkit-details-marker { display: none; }
  .fwcard[open], .gcard[open] { border-color: var(--accent); }
  .fchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .fchip { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--sub);
           border-radius: 999px; padding: 5px 13px; font-size: 13px; font-family: inherit; cursor: pointer; }
  .fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* ---- 右上角学科切换 ---- */
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  /* 学科选择：大图标 + 文字，像手机 App 的学科选择 */
  .subjbar { display: flex; gap: 20px; flex-wrap: wrap; margin: 18px 0 6px; }
  .subjcard { appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
              display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .subjicon { width: 66px; height: 66px; border-radius: 20px; display: grid; place-items: center;
              font-size: 27px; font-weight: 700; color: #fff; letter-spacing: 0;
              box-shadow: 0 2px 6px rgba(20,28,54,.14); transition: transform .12s ease, box-shadow .12s ease; }
  .subjcard:hover .subjicon { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(20,28,54,.18); }
  .subjlabel { font-size: 13px; color: var(--muted); line-height: 1.2; white-space: nowrap; }
  .subjcard.on .subjicon { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--accent), 0 4px 10px rgba(77,107,254,.28); }
  .subjcard.on .subjlabel { color: var(--accent); font-weight: 600; }
  .subjcard:not(.on) .subjicon { filter: saturate(.72); opacity: .9; }
  /* ---- 大肥鱼（页角看护人） ---- */
  .mascot { position: fixed; right: 18px; bottom: 14px; width: 92px; height: 92px;
            z-index: 50; cursor: pointer; user-select: none; }
  .mascot .m-face { display: block; width: 100%; height: 100%; border-radius: 50%;
                    object-fit: cover; background: #fff; box-shadow: 0 0 0 3px #fff, 0 8px 20px rgba(58,81,214,.22);
                    transition: transform .2s ease; }
  .mascot .m-face { -webkit-user-drag: none; }
  .m-mouth { display: none; }
  .mood-idle .m-mouth-idle, .mood-happy .m-mouth-happy,
  .mood-sad .m-mouth-sad, .mood-think .m-mouth-think { display: block; }
  .mood-happy .m-face { transform: rotate(-4deg) translateY(-2px) scale(1.02); }
  .mood-sad .m-face { transform: translateY(2px) rotate(2deg); }
  .mood-think .m-face { transform: rotate(3deg); }
  .mood-act .m-face { transform: translateY(-3px) scale(1.03); }
  .m-bubble { position: absolute; right: 96px; bottom: 40px; max-width: 220px;
              background: #fff; border: 1px solid var(--line); color: var(--ink);
              border-radius: 12px; padding: 8px 11px; font-size: 13px; line-height: 1.5;
              opacity: 0; transform: translateY(4px) scale(.96); transition: opacity .16s, transform .16s;
              pointer-events: none; white-space: normal; }
  .m-bubble::after { content: ''; position: absolute; right: -6px; bottom: 12px;
                     width: 10px; height: 10px; background: #fff;
                     border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
                     transform: rotate(-45deg); }
  .mascot.talking .m-bubble { opacity: 1; transform: translateY(0) scale(1); }
  .mascot.talking { animation: mbob 1.6s ease-in-out infinite; }
  @keyframes mbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  /* 开关（「只为没掌握的考点出题」那一行） */
  .switch { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
            font-size: 14px; color: var(--ink); cursor: pointer; user-select: none; }
  .switch input { appearance: none; width: 38px; height: 22px; border-radius: 11px;
                  background: #cfd8ea; position: relative; transition: background .16s; cursor: pointer; margin: 0; }
  .switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                         border-radius: 50%; background: #fff; transition: transform .16s;
                         box-shadow: 0 1px 2px rgba(27,37,54,.25); }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(16px); }
  /* 表格与选项的细节打磨 */
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: 600; font-size: 13px; color: var(--sub);
       border-bottom: 1px solid var(--line); padding: 8px 6px; }
  td { border-bottom: 1px solid #f1f4fb; padding: 8px 6px; font-size: 14px; }
  tbody tr:hover td { background: #fafbff; }
  select { background: #fff; color: var(--ink); }
  select:focus, .btn:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 1px; }
  .choice, .opt { transition: background .12s, border-color .12s, transform .08s; }
  .choice:hover, .opt:hover { border-color: var(--accent); }
  .choice:active, .opt:active { transform: scale(.995); }

  /* ---------- 知识点图 ---------- */
  /* 下钻式导航：面包屑 / 知识块卡片 / 考点行 */
  .crumbs { display: flex; align-items: center; gap: 6px; margin: 2px 0 12px; flex-wrap: wrap; font-size: 13px; }
  .crumbs i { color: var(--muted); font-style: normal; }
  .crumb { appearance: none; border: 0; background: none; padding: 2px 4px; border-radius: 6px;
           color: var(--accent); cursor: pointer; font: inherit; }
  .crumb:hover { background: var(--accent-soft, #eef2ff); }
  .crumb-cur { color: var(--muted); padding: 2px 4px; }
  .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .bcard { appearance: none; text-align: left; font: inherit; cursor: pointer;
           background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
           display: flex; flex-direction: column; gap: 7px; transition: box-shadow .12s ease, transform .12s ease; }
  .bcard:hover { box-shadow: 0 6px 18px rgba(20,28,54,.10); transform: translateY(-1px); border-color: var(--accent); }
  .btitle { font-weight: 600; font-size: 15px; }
  .bchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; padding: 2px 7px; border-radius: 999px; background: #f2f4fa; color: var(--muted); }
  .chip.ok { background: #e8f6ee; color: #1f8a52; }
  .chip.mid { background: #fdf4e3; color: #a8761c; }
  .chip.bad { background: #fbeceb; color: #b4453c; }
  .bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: #eef0f6; width: 100%; }
  .bar i { display: block; height: 100%; }
  .bar i.ok { background: #3fae74; } .bar i.mid { background: #e0a63a; }
  .bar i.bad { background: #d1554a; } .bar i.none { background: #d8dce8; }
  .tlist { display: flex; flex-direction: column; gap: 8px; }
  .trow { appearance: none; font: inherit; text-align: left; cursor: pointer; background: #fff;
          border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
          display: flex; align-items: center; gap: 10px; }
  .trow:hover { border-color: var(--accent); box-shadow: 0 3px 10px rgba(20,28,54,.07); }
  .tid { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; }
  .tname { flex: 1; }
  .tmeta { font-size: 12px; color: var(--muted); }
  .linkbtn { appearance: none; border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
  .linkbtn:hover { text-decoration: underline; }
  .maptools { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .mbtn { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
          border-radius: 9px; padding: 5px 11px; font-size: 13px; cursor: pointer; line-height: 1.4; }
  .mbtn:hover { border-color: var(--accent); color: var(--accent); }
  .mbtn.wide { padding: 5px 12px; }
  .mzoom { min-width: 46px; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mapwrap { overflow: auto; margin-top: 10px; padding-bottom: 6px; cursor: grab;
             border: 1px solid var(--line); border-radius: 12px; background:
             linear-gradient(#fff, #fff) padding-box, radial-gradient(circle at 1px 1px, #e6eaf5 1px, transparent 0) padding-box;
             background-size: auto, 22px 22px; }
  .mapwrap.dragging { cursor: grabbing; }
  .mapwrap::-webkit-scrollbar { height: 10px; width: 10px; }
  .mapwrap::-webkit-scrollbar-thumb { background: #ccd4e8; border-radius: 6px; }
  .mapwrap svg.kmap { display: block; }
  .kmap { display: block; }
  .kmap-col { font-size: 13px; font-weight: 600; fill: var(--sub); }
  .kmap-link { stroke: #d7dbe6; stroke-width: 1.6; fill: none; }
  .kmap-edge { stroke: var(--accent); stroke-width: 1.6; fill: none; opacity: .55;
               stroke-dasharray: 5 4; marker-end: none; }
  .kmap-edge.back { stroke: #c3b6e8; }
  .knode { cursor: pointer; }
  .kbox { fill: #fff; stroke: #dde1ea; stroke-width: 1.4; }
  .knode.gA .kbox { fill: #f2f5ff; } .knode.gB .kbox { fill: #f0faf7; }
  .knode.gC .kbox { fill: #fff8ec; } .knode.gD .kbox { fill: #f8f2ff; }
  .kid { font-size: 11px; fill: var(--sub); }
  .kname { font-size: 12.5px; fill: var(--ink); }
  .knode.st-ok .kbox { stroke: #3fa37a; } .knode.st-ok .kdot { fill: #3fa37a; }
  .knode.st-bad .kbox { stroke: var(--wrong); } .knode.st-bad .kdot { fill: var(--wrong); }
  .knode.st-mid .kbox { stroke: var(--warn); stroke-dasharray: 4 3; } .knode.st-mid .kdot { fill: var(--warn); }
  .knode.st-none .kbox { stroke-dasharray: 3 3; }
  .knode:hover .kbox { stroke: var(--accent); }
  .knode.on .kbox { stroke: var(--accent); stroke-width: 2.4; }
  .klegend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
             font-size: 12px; color: var(--sub); margin-top: 10px; }
  .klegend .sep { width: 1px; height: 14px; background: var(--line); }
  .klegend .lg { display: inline-block; width: 12px; height: 12px; border-radius: 4px;
                 margin-right: 5px; vertical-align: -2px; }
  .klegend .lg.gA { background: #f2f5ff; border: 1px solid var(--accent); }
  .klegend .lg.gB { background: #f0faf7; border: 1px solid #3fa37a; }
  .klegend .lg.gC { background: #fff8ec; border: 1px solid var(--warn); }
  .klegend .lg.gD { background: #f8f2ff; border: 1px solid #9b7fe0; }
  .klegend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                  margin-right: 5px; vertical-align: 1px; background: #cfd4df; }
  .klegend .dot.ok { background: #3fa37a; } .klegend .dot.mid { background: var(--warn); }
  .klegend .dot.bad { background: var(--wrong); }

  .kchips { display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
  .kchip { appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink);
           font-size:12.5px; padding:4px 10px; border-radius:999px; cursor:pointer; }
  .kchip:hover { border-color:var(--accent); color:var(--accent); }
  .kchip.pre { background:#f2f6ff; border-color:#d5e0ff; }
  .kchip.next { background:#f3fbf5; border-color:#cfe9d6; }
  .mtight { margin:6px 0 0; padding-left:20px; }
  .mtight li { margin:3px 0; line-height:1.55; }
  .mtight.warn li { color:#8d3a34; }
  .fbox { margin-top:6px; display:flex; flex-direction:column; gap:6px; }
  .fml { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; background:#f6f8ff;
         border:1px solid #e2e8fb; border-radius:8px; padding:7px 10px; }
  .tsub { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  .tside { font-size:12px; }
  .kdetail { margin-top: 12px; }

    window.addEventListener('error', function (e) {
